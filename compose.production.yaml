x-production: &production
  environment:
    APP_ENV: production
    MAX_MODE: real
    MAX_BOT_TOKEN: ''
    MAX_WEBHOOK_SECRET: ''
    MAX_BOT_TOKEN_FILE: /run/secrets/max_bot_token
    MAX_WEBHOOK_SECRET_FILE: /run/secrets/max_webhook_secret
  secrets:
    - max_bot_token
    - max_webhook_secret
services:
  api:
    <<: *production
  worker:
    <<: *production
  migrate:
    <<: *production
  edge:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set your public domain in .env.production}
    ports: ['443:443']
secrets:
  max_bot_token:
    file: ./secrets/max_bot_token.txt
  max_webhook_secret:
    file: ./secrets/max_webhook_secret.txt
