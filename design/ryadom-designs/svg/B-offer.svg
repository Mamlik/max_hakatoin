<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Линия дня — 05 Предложение"><title>05 Предложение</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#FCF7F0" stroke="none"/><text id="text-1" x="24" y="28" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#402B26">9:41</text><text id="text-2" x="287" y="28" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#402B26">LTE  ▰</text><text id="text-3" x="24" y="65" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#402B26">‹</text><a href="#back" aria-label="Назад"><rect x="8" y="36" width="48" height="44" fill="transparent"/></a><text id="text-4" x="150" y="64" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#402B26">рядом</text><text id="text-5" x="340" y="63" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#402B26">···</text><path d="M0 80L390 80" stroke="#E7D5C5" fill="none"/><text id="text-6" x="24" y="109" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#796057">ЛИНИЯ / ЛИЧНЫЙ КАБИНЕТ</text><a href="#entry" aria-label="Сменить кабинет"><rect x="20" y="80" width="350" height="44" fill="transparent"/></a><text id="text-7" x="24" y="154" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#402B26">Есть подходящее окно</text><text id="text-8" x="24" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#796057">ПРЕДЛОЖЕНИЕ · 29 СЕНТЯБРЯ</text><rect x="48" y="213" width="318" height="91" rx="4" fill="#FFFFFF" stroke="none"/><path d="M30 213L30 313" stroke="#E7D5C5" fill="none"/><rect x="25" y="234" width="10" height="10" rx="5" fill="#98432B" stroke="none"/><text id="text-9" x="64" y="242" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#402B26">Сегодня · 14:00–15:00</text><text id="text-10" x="64" y="266" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#796057">Стрижка и укладка · Анна</text><text id="text-11" x="64" y="289" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#98432B">Линия · Москва, UTC+3</text><text id="text-12" x="24" y="350" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#402B26">2 400 ₽</text><text id="text-13" x="24" y="379" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#796057">Итоговая цена · оплата в салоне</text><rect x="24" y="407" width="342" height="85" rx="12" fill="#F5E4D3" stroke="none"/><text id="text-14" x="38" y="431" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#402B26">Действует до 12:10 · осталось 08:42</text><text id="text-15" x="38" y="452" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#402B26">Время доступно другим клиентам</text><text id="text-16" x="38" y="473" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#402B26">и не зарезервировано.</text><text id="text-17" x="24" y="518" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#796057">Перед записью ещё раз проверим время.</text><text id="text-18" x="24" y="539" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#796057">Оно может стать недоступным.</text><rect x="24" y="582" width="342" height="48" rx="12" fill="#98432B" stroke="none"/><text id="text-19" x="40" y="612" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Записаться</text><a href="#checking" aria-label="Записаться"><rect x="24" y="582" width="342" height="48" fill="transparent"/></a><rect x="24" y="644" width="342" height="48" rx="12" fill="#FFFFFF" stroke="#E7D5C5"/><text id="text-20" x="40" y="674" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#402B26">Не подходит</text><a href="#decline" aria-label="Не подходит"><rect x="24" y="644" width="342" height="48" fill="transparent"/></a><rect x="0" y="758" width="390" height="86" rx="0" fill="#FFFFFF" stroke="none"/><path d="M0 758L390 758" stroke="#E7D5C5" fill="none"/><text id="text-21" x="16" y="795" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#796057">Салон</text><a href="#store" aria-label="Салон"><rect x="0" y="764" width="130" height="52" fill="transparent"/></a><text id="text-22" x="146" y="795" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#796057">Записи</text><a href="#bookings" aria-label="Записи"><rect x="130" y="764" width="130" height="52" fill="transparent"/></a><text id="text-23" x="276" y="795" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#796057">Награды</text><a href="#loyalty" aria-label="Награды"><rect x="260" y="764" width="130" height="52" fill="transparent"/></a><rect x="143" y="829" width="104" height="4" rx="2" fill="#402B26" stroke="none"/></svg>