name: max-salons
x-app: &app
  build:
    context: .
    dockerfile: ops/docker/Dockerfile.app
  environment: &app-env
    APP_ENV: ${APP_ENV:-demo}
    MAX_MODE: ${MAX_MODE:-mock}
    PORT: 3000
    PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
    DATABASE_URL: postgres://salon_runtime:${POSTGRES_RUNTIME_PASSWORD:-salon_runtime_local_only}@postgres:5432/salon
    REDIS_URL: redis://redis:6379
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-demo-only-synthetic-token}
    MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-demo-webhook-secret}
    MAX_BOT_NAME: ${MAX_BOT_NAME:-salons_demo_bot}
    MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
    MAX_GLOBAL_RPS: ${MAX_GLOBAL_RPS:-25}
    MAX_DIALOG_RPS: ${MAX_DIALOG_RPS:-1}
    MEDIA_ROOT: /app/media
    SALON_DISCOVERY_SEARCH_ENABLED: ${SALON_DISCOVERY_SEARCH_ENABLED:-true}
    SALON_DISCOVERY_MAP_ENABLED: ${SALON_DISCOVERY_MAP_ENABLED:-true}
    SALON_DISCOVERY_EDITOR_ENABLED: ${SALON_DISCOVERY_EDITOR_ENABLED:-true}
    SALON_DISCOVERY_MAP_STYLE_LIGHT_URL: ${SALON_DISCOVERY_MAP_STYLE_LIGHT_URL:-https://tiles.openfreemap.org/styles/positron}
    SALON_DISCOVERY_MAP_STYLE_DARK_URL: ${SALON_DISCOVERY_MAP_STYLE_DARK_URL:-https://tiles.openfreemap.org/styles/fiord}
    SALON_DISCOVERY_GEOCODER_ENABLED: ${SALON_DISCOVERY_GEOCODER_ENABLED:-true}
    SALON_DISCOVERY_GEOCODER_PROVIDER: ${SALON_DISCOVERY_GEOCODER_PROVIDER:-nominatim}
    SALON_DISCOVERY_NOMINATIM_URL: ${SALON_DISCOVERY_NOMINATIM_URL:-https://nominatim.openstreetmap.org/search}
    SALON_DISCOVERY_GEOAPIFY_API_KEY: ${SALON_DISCOVERY_GEOAPIFY_API_KEY:-}
    PLATFORM_ADMIN_MAX_IDS: ${PLATFORM_ADMIN_MAX_IDS:-}
  volumes:
    - media:/app/media
  restart: unless-stopped
services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salon_local_only}
      POSTGRES_DB: salon
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-salon_runtime_local_only}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./ops/docker/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U salon -d salon]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *app
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: postgres://salon:${POSTGRES_PASSWORD:-salon_local_only}@postgres:5432/salon
    command: [sh, -c, 'npm run db:migrate && npx tsx ops/scripts/grants.ts']
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  seed:
    <<: *app
    profiles: [demo]
    command: [npm, run, db:seed]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: 'no'
  api:
    <<: *app
    command: [npm, run, start:api]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: [npm, run, start:worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  edge:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.web
    ports: ['${HTTP_PORT:-8080}:80']
    depends_on:
      api: {condition: service_healthy}
    volumes: [caddy_data:/data, caddy_config:/config]
    restart: unless-stopped
volumes:
  postgres:
  redis:
  media:
  caddy_data:
  caddy_config:
